name: WASM

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'extras/images/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'extras/images/**'
  workflow_dispatch:
    inputs:
      publish_to_npm:
        description: 'Publish the generated npm package'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

concurrency:
  group: wasm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "Ubuntu", os: "ubuntu-24.04", target: "wasm" }

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install System Packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            doxygen cmake ninja-build
          doxygen --version
          cmake --version
          ninja --version

      - name: Upgrade PIP
        run: python3 -m pip install --upgrade pip setuptools wheel

      - name: Install EMSDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p emsdk
          cd emsdk
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git .
          ./emsdk install 6.0.0
          ./emsdk activate 6.0.0
          echo "EMSDK=${{ github.workspace }}/emsdk" >> "$GITHUB_ENV"
          echo "${{ github.workspace }}/emsdk:${{ github.workspace }}/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          architecture: 'x64'

      - name: Verify Toolchain
        run: |
          set -euo pipefail
          python3 --version
          cmake --version
          ninja --version
          node --version
          npm --version
          emcc -v

      - name: Python requirements
        run: python3 -m pip install --user -r requirements.txt

      - name: Depot tools
        run: python3 make.py build-depot-tools

      - name: Environment
        run: echo "$PWD/build/depot-tools" >> "$GITHUB_PATH"

      - name: PDFium
        run: python3 make.py build-pdfium-${{ matrix.config.target }}

      - name: Patch
        run: python3 make.py patch-${{ matrix.config.target }}

      - name: Patch - Check
        run: python3 make.py patch-${{ matrix.config.target }}

      - name: Build
        run: python3 make.py build-${{ matrix.config.target }}

      - name: Install
        run: python3 make.py install-${{ matrix.config.target }}

      - name: Test
        run: python3 make.py test-${{ matrix.config.target }}

      - name: Generate
        run: python3 make.py generate-${{ matrix.config.target }}

      - name: Package npm artifacts
        env:
          NPM_PACKAGE_REVISION: ${{ format('{0}.{1}', github.run_number, github.run_attempt) }}
        run: python3 make.py package-wasm

      - name: Smoke test npm package
        run: |
          cd build/emscripten/wasm/release/npm-package
          node -e "const pkg = require('./index.cjs'); if (typeof pkg !== 'function' && typeof pkg !== 'object') { process.exit(1) } console.log('npm package smoke test OK')"

      - name: Validate npm package manifest
        run: |
          set -euo pipefail
          cd build/emscripten/wasm/release/npm-package
          npm pack --dry-run --json > pack-preview.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('pack-preview.json').read_text())
          if not data:
              raise SystemExit('npm pack preview was empty')
          print(f"npm pack preview: {data[0]['filename']}")
          PY

      - name: Show npm package version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          pkg = json.loads(Path('build/emscripten/wasm/release/npm-package/package.json').read_text())
          print(f"npm package version: {pkg['name']}@{pkg['version']}")
          PY

      - name: Upload npm package artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: build/emscripten/wasm/release/npm-package

      - name: Verify WASM exports
        run: |
          python3 scripts/verify_wasm_exports.py \
            build/emscripten/wasm/release/node/pdfium.js \
            build/emscripten/wasm/release/node/pdfium.esm.js

      - name: Test WasmTime
        run: python3 make.py test-${{ matrix.config.target }}time

      - name: Archive
        run: python3 make.py archive-${{ matrix.config.target }}

      - name: Save
        uses: actions/upload-artifact@v7
        with:
          name: artifact-${{ matrix.config.target }}
          path: ${{ matrix.config.target }}.tgz

  publish-npm:
    name: Publish npm package
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_npm == 'true'
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    steps:
      - name: Download npm package artifact
        uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: npm-package
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify npm package manifest
        working-directory: npm-package
        run: |
          set -euo pipefail
          npm pack --dry-run --json > pack-preview.json
          npm pkg get name version
      - name: Publish npm package
        working-directory: npm-package
        env:
          NPM_DIST_TAG: latest
        run: |
          set -euo pipefail
          npm publish --provenance --access public --tag "${NPM_DIST_TAG}"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Load
        uses: actions/download-artifact@v8
        with:
          name: artifact-wasm
      - name: Get release
        id: get_release
        uses: bruceadams/get-release@v1.2.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload release asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_path: wasm.tgz
          asset_name: wasm.tgz
          asset_content_type: application/tar+gzip
