name: WASM

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'extras/images/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'extras/images/**'
  workflow_dispatch:
    inputs:
      publish_to_npm:
        description: 'Publish the generated npm package'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

concurrency:
  group: wasm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "Ubuntu", os: "ubuntu-24.04", target: "wasm" }

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Cache apt package archives
        id: cache-apt-packages
        uses: actions/cache@v5
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-deb-${{ runner.os }}-${{ hashFiles('.github/workflows/wasm.yml') }}
          restore-keys: |
            apt-deb-${{ runner.os }}-

      - name: Install System Packages
        run: |
          set -euo pipefail
          sudo mkdir -p /var/cache/apt/archives/partial
          if [ "${{ steps.cache-apt-packages.outputs.cache-hit }}" != "true" ]; then
            sudo apt-get update
          else
            echo "Using cached apt package archives"
          fi
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            doxygen cmake ninja-build
          doxygen --version
          cmake --version
          ninja --version

      - name: Upgrade PIP
        run: python3 -m pip install --upgrade pip setuptools wheel

      - name: Cache EMSDK
        id: cache-emsdk
        uses: actions/cache@v5
        with:
          path: emsdk
          key: emsdk-6.0.0-${{ runner.os }}

      - name: Install EMSDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p emsdk
          cd emsdk
          if [ ! -x ./emsdk ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git .
          fi
          if [ ! -d "upstream/emscripten" ]; then
            ./emsdk install 6.0.0
            ./emsdk activate 6.0.0
          fi
          echo "EMSDK=${{ github.workspace }}/emsdk" >> "$GITHUB_ENV"
          echo "${{ github.workspace }}/emsdk:${{ github.workspace }}/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          architecture: 'x64'

      - name: Verify Toolchain
        run: |
          set -euo pipefail
          python3 --version
          cmake --version
          ninja --version
          node --version
          npm --version
          emcc -v

      - name: Python requirements
        run: python3 -m pip install --user -r requirements.txt

      - name: Cache depot tools
        uses: actions/cache@v5
        with:
          path: build/depot-tools
          key: depot-tools-${{ runner.os }}-${{ hashFiles('make.py') }}

      - name: Depot tools
        run: python3 make.py build-depot-tools

      - name: Environment
        run: echo "$PWD/build/depot-tools" >> "$GITHUB_PATH"

      - name: Restore wasm build cache
        id: cache-wasm-build
        uses: actions/cache@v5
        with:
          path: |
            build/emscripten/pdfium
            build/emscripten/wasm
          key: wasm-build-${{ runner.os }}-${{ hashFiles('make.py', 'modules/*.py', 'requirements.txt', 'scripts/verify_wasm_exports.py', 'extras/wasm/**') }}
          restore-keys: |
            wasm-build-${{ runner.os }}-

      - name: Show wasm build cache status
        run: echo "wasm build cache hit=${{ steps.cache-wasm-build.outputs.cache-hit }}"

      - name: PDFium
        if: steps.cache-wasm-build.outputs.cache-hit != 'true'
        run: python3 make.py build-pdfium-${{ matrix.config.target }}

      - name: Patch
        if: steps.cache-wasm-build.outputs.cache-hit != 'true'
        run: python3 make.py patch-${{ matrix.config.target }}

      - name: Patch - Check
        if: steps.cache-wasm-build.outputs.cache-hit != 'true'
        run: python3 make.py patch-${{ matrix.config.target }}

      - name: Build
        if: steps.cache-wasm-build.outputs.cache-hit != 'true'
        run: python3 make.py build-${{ matrix.config.target }}

      - name: Install
        if: steps.cache-wasm-build.outputs.cache-hit != 'true'
        run: python3 make.py install-${{ matrix.config.target }}

      - name: Test
        if: steps.cache-wasm-build.outputs.cache-hit != 'true'
        run: python3 make.py test-${{ matrix.config.target }}

      - name: Generate
        if: steps.cache-wasm-build.outputs.cache-hit != 'true'
        run: python3 make.py generate-${{ matrix.config.target }}

      - name: Package npm artifacts
        env:
          NPM_PACKAGE_REVISION: ${{ format('{0}.{1}', github.run_number, github.run_attempt) }}
        run: python3 make.py package-wasm

      - name: Smoke test npm package
        run: |
          cd build/emscripten/wasm/release/npm-package
          node -e "const pkg = require('./index.cjs'); if (typeof pkg !== 'function' && typeof pkg !== 'object') { process.exit(1) } console.log('npm package smoke test OK')"

      - name: Upload npm package artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: build/emscripten/wasm/release/npm-package

      - name: Verify WASM exports
        run: |
          python3 scripts/verify_wasm_exports.py \
            build/emscripten/wasm/release/node/pdfium.js \
            build/emscripten/wasm/release/node/pdfium.esm.js

      - name: Test WasmTime
        run: python3 make.py test-${{ matrix.config.target }}time

      - name: Archive
        run: python3 make.py archive-${{ matrix.config.target }}

      - name: Save
        uses: actions/upload-artifact@v7
        with:
          name: artifact-${{ matrix.config.target }}
          path: ${{ matrix.config.target }}.tgz

  publish-npm:
    name: Publish npm package
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_npm == 'true'
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    steps:
      - name: Download npm package artifact
        uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: npm-package
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify npm package manifest
        working-directory: npm-package
        run: |
          set -euo pipefail
          npm pack --dry-run --json > pack-preview.json
          npm pkg get name version
      - name: Show npm package version
        working-directory: npm-package
        run: |
          set -euo pipefail
          npm pkg get name version
      - name: Fresh install smoke test
        working-directory: npm-package
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          npm pack --pack-destination "$tmpdir"
          cd "$tmpdir"
          npm init -y >/dev/null 2>&1
          npm install "$(find "$tmpdir" -maxdepth 1 -name '*.tgz' | head -n 1)" >/dev/null 2>&1
          pkg_dir="$tmpdir/node_modules/@techstark/pdfium"
          if [ ! -f "$pkg_dir/package.json" ]; then
            echo "installed package directory not found" >&2
            exit 1
          fi
          node -e "const pkg = require('$pkg_dir/index.cjs'); if (typeof pkg !== 'function' && typeof pkg !== 'object') { process.exit(1) } console.log('fresh install smoke test OK')"
      - name: Publish npm package
        working-directory: npm-package
        env:
          NPM_DIST_TAG: beta
        run: |
          set -euo pipefail
          npm publish --provenance --access public --tag "${NPM_DIST_TAG}"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Load
        uses: actions/download-artifact@v8
        with:
          name: artifact-wasm
      - name: Get release
        id: get_release
        uses: bruceadams/get-release@v1.2.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload release asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_path: wasm.tgz
          asset_name: wasm.tgz
          asset_content_type: application/tar+gzip
